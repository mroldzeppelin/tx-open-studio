<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- TX Open Studio icon: amp knob on the app's dark green theme -->
  <defs>
    <radialGradient id="dial" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2b3a2f"/>
      <stop offset="1" stop-color="#202e25"/>
    </radialGradient>
  </defs>
  <!-- background tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#141b18"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#3a4b3e" stroke-width="6"/>
  <!-- knob body -->
  <circle cx="128" cy="128" r="78" fill="url(#dial)" stroke="#3e7750" stroke-width="8"/>
  <!-- tick marks around the knob -->
  <g stroke="#53644f" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="20" x2="128" y2="34"/>
    <line x1="52" y1="204" x2="62" y2="194"/>
    <line x1="204" y1="204" x2="194" y2="194"/>
    <line x1="24" y1="128" x2="38" y2="128"/>
    <line x1="232" y1="128" x2="218" y2="128"/>
  </g>
  <!-- indicator dot at ~1 o'clock -->
  <circle cx="158" cy="76" r="14" fill="#86b778"/>
</svg>
