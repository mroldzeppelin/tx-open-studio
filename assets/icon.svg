<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- TX Open Studio icon: the app's Knob (same geometry/colors as ui/app.slint,
       viewbox scaled 2x: ring r=44->88, width 8->16, cap 72%->r72, pointer 14..31->28..62)
       set to ~70% with TX / OPEN lettering on the cap -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4149"/>
      <stop offset="0.75" stop-color="#1c1e22"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d21"/>
      <stop offset="0.4" stop-color="#141518"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
  </defs>
  <!-- background tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#2c2f36" stroke-width="6"/>
  <!-- track arc: -135° -> +135° -->
  <path d="M 65.77 190.23 A 88 88 0 1 1 190.23 190.23"
        fill="none" stroke="#2a2d33" stroke-width="16"/>
  <!-- value arc: -135° -> +135° (full, cranked to max) -->
  <path d="M 65.77 190.23 A 88 88 0 1 1 190.23 190.23"
        fill="none" stroke="#f59e0b" stroke-width="16"/>
  <!-- cap -->
  <circle cx="128" cy="128" r="72" fill="url(#cap)" stroke="#08090a" stroke-width="2"/>
  <!-- pointer at +135° -->
  <line x1="161.94" y1="161.94" x2="176.08" y2="176.08"
        stroke="#f2f3f5" stroke-width="9" stroke-linecap="round"/>
  <!-- lettering -->
  <text x="128" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="72" fill="#ece2cf">TX</text>
  <text x="128" y="180" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="23" letter-spacing="9" fill="#f59e0b">OPEN</text>
</svg>
