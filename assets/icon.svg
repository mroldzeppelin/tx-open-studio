<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- TX Open Studio icon: TX / OPEN over a knob background -->
  <defs>
    <radialGradient id="dial" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2b3a2f"/>
      <stop offset="1" stop-color="#1d2721"/>
    </radialGradient>
  </defs>
  <!-- background tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#141b18"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#3a4b3e" stroke-width="6"/>
  <!-- knob as a subdued background -->
  <circle cx="128" cy="128" r="86" fill="url(#dial)" stroke="#3e7750" stroke-width="7" opacity="0.9"/>
  <g stroke="#53644f" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="128" y1="22" x2="128" y2="34"/>
    <line x1="50" y1="206" x2="60" y2="196"/>
    <line x1="206" y1="206" x2="196" y2="196"/>
    <line x1="22" y1="128" x2="34" y2="128"/>
    <line x1="234" y1="128" x2="222" y2="128"/>
  </g>
  <!-- indicator dot -->
  <circle cx="162" cy="72" r="11" fill="#86b778"/>
  <!-- lettering -->
  <text x="128" y="148" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="84" fill="#edf3e9">TX</text>
  <text x="128" y="186" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="26" letter-spacing="10" fill="#86b778">OPEN</text>
</svg>
